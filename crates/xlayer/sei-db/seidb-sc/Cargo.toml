[package]
name = "seidb-sc"
version = "0.1.0"
edition = "2024"

[dependencies]
seidb-common = { workspace = true }
seidb-traits = { workspace = true }
seidb-proto = { workspace = true }
seidb-engine = { workspace = true }
seidb-wal = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true, features = ["std"] }
memmap2 = { workspace = true }
ics23 = { workspace = true }
bytemuck = { workspace = true }
rayon = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
fs4 = { workspace = true }
prost = { workspace = true }
crossbeam-channel = { workspace = true }
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-rlp = { workspace = true, features = ["derive"] }
alloy-trie = { workspace = true, features = ["ethereum"] }
revm-database = { workspace = true }
revm-state = { workspace = true }
reth-trie-common = { workspace = true }
reth-primitives-traits = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[features]
default = []
asm-keccak = ["alloy-primitives/asm-keccak"]

[dev-dependencies]
tempfile = { workspace = true }
criterion.workspace = true
hex = "0.4"
rand = { workspace = true }
reth-trie = { workspace = true, features = ["test-utils"] }
reth-primitives-traits = { workspace = true, features = ["test-utils"] }

[[bench]]
name = "memiavl_bench"
harness = false

[[bench]]
name = "flatkv_bench"
harness = false

[[bench]]
name = "mpt_parallel_bench"
harness = false

[[bench]]
name = "mpt_commit_bench"
harness = false
