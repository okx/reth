[package]
name = "op-reth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[dependencies]
reth-cli-util.workspace = true
reth-optimism-cli.workspace = true
reth-optimism-rpc.workspace = true
reth-optimism-node.workspace = true
reth-optimism-chainspec.workspace = true
reth-optimism-consensus.workspace = true
reth-optimism-evm.workspace = true
reth-optimism-payload-builder.workspace = true
reth-optimism-primitives.workspace = true
reth-optimism-forks.workspace = true
reth-apollo.workspace = true
reth-chainspec.workspace = true
alloy-genesis.workspace = true
reth-provider.workspace = true
reth-storage-api.workspace = true
reth-trie-common.workspace = true
reth-db.workspace = true
reth-db-common.workspace = true
reth-node-types.workspace = true
reth-fs-util.workspace = true
reth-primitives-traits.workspace = true
alloy-primitives.workspace = true
alloy-trie.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
tracing.workspace = true
uuid = { version = "1", features = ["v4", "fast-rng"] }
# xlayer
xlayer-rpc.workspace = true
xlayer-db.workspace = true
tempdir.workspace = true
triedb.workspace = true
eyre.workspace = true
rand.workspace = true
serde_json.workspace = true
[lints]
workspace = true

[features]
default = ["jemalloc", "otlp", "reth-optimism-evm/portable", "js-tracer"]

otlp = ["reth-optimism-cli/otlp"]

js-tracer = [
    "reth-optimism-node/js-tracer",
]

jemalloc = ["reth-cli-util/jemalloc", "reth-optimism-cli/jemalloc"]
jemalloc-prof = ["reth-cli-util/jemalloc-prof"]
tracy-allocator = ["reth-cli-util/tracy-allocator"]

asm-keccak = ["reth-optimism-cli/asm-keccak", "reth-optimism-node/asm-keccak"]

dev = [
    "reth-optimism-cli/dev",
    "reth-optimism-primitives/arbitrary",
]

min-error-logs = ["tracing/release_max_level_error"]
min-warn-logs = ["tracing/release_max_level_warn"]
min-info-logs = ["tracing/release_max_level_info"]
min-debug-logs = ["tracing/release_max_level_debug"]
min-trace-logs = ["tracing/release_max_level_trace"]

[[bin]]
name = "op-reth"
path = "src/main.rs"

[[bin]]
name = "state_root_overlay"
path = "src/state_root_overlay.rs"

[[bin]]
name = "merge_genesis"
path = "src/merge_genesis.rs"
