[package]
name = "reth-qmdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Reth node with QMDB state backend and parallel execution for benchmarking"

[lints]
workspace = true

[dependencies]
# reth
reth-chainspec.workspace = true
reth-node-builder.workspace = true
reth-node-core.workspace = true
reth-provider.workspace = true
reth-cli-util.workspace = true
reth-engine-primitives.workspace = true

# op-reth
reth-optimism-cli.workspace = true
reth-optimism-node.workspace = true
reth-optimism-chainspec.workspace = true
reth-optimism-evm.workspace = true
reth-optimism-payload-builder.workspace = true
reth-optimism-primitives.workspace = true
reth-optimism-forks.workspace = true

# xlayer
xlayer-qmdb-provider.workspace = true

# alloy
alloy-consensus.workspace = true
alloy-primitives.workspace = true

# revm
revm-database.workspace = true
revm-state.workspace = true

# async
tokio = { workspace = true, features = ["sync", "macros", "time", "rt-multi-thread"] }

# misc
clap = { workspace = true, features = ["derive", "env"] }
eyre.workspace = true
tracing.workspace = true

[features]
default = ["jemalloc", "asm-keccak", "otlp", "otlp-logs", "js-tracer", "keccak-cache-global"]

otlp = [
    "reth-optimism-cli/otlp",
    "reth-node-core/otlp",
]
otlp-logs = [
    "reth-optimism-cli/otlp-logs",
    "reth-node-core/otlp-logs",
]

jemalloc = [
    "reth-cli-util/jemalloc",
    "reth-node-core/jemalloc",
    "reth-optimism-cli/jemalloc",
]

asm-keccak = [
    "reth-node-core/asm-keccak",
    "reth-optimism-cli/asm-keccak",
    "reth-optimism-node/asm-keccak",
]

js-tracer = [
    "reth-optimism-node/js-tracer",
]

keccak-cache-global = [
    "reth-optimism-cli/keccak-cache-global",
    "reth-optimism-node/keccak-cache-global",
]

dev = ["reth-optimism-cli/dev"]

[[bin]]
name = "reth-qmdb"
path = "src/main.rs"
