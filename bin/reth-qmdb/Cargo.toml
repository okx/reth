[package]
name = "reth-qmdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Reth node with QMDB state backend for benchmarking"

[lints]
workspace = true

[dependencies]
# reth
reth-chainspec.workspace = true
reth-node-builder.workspace = true
reth-node-core.workspace = true
reth-provider.workspace = true
reth-cli-util.workspace = true
reth-engine-primitives.workspace = true

# ethereum
reth-ethereum-cli.workspace = true
reth-node-ethereum.workspace = true
reth-ethereum-engine-primitives.workspace = true
reth-ethereum-payload-builder.workspace = true
reth-ethereum-primitives.workspace = true
reth-evm.workspace = true
reth-node-api.workspace = true
reth-transaction-pool.workspace = true

# xlayer
xlayer-qmdb-provider.workspace = true

# alloy
alloy-consensus.workspace = true
alloy-primitives.workspace = true

# revm
revm-database.workspace = true
revm-state.workspace = true

# async
tokio = { workspace = true, features = ["sync", "macros", "time", "rt-multi-thread"] }

# misc
clap = { workspace = true, features = ["derive", "env"] }
eyre.workspace = true
tracing.workspace = true

[features]
default = ["jemalloc", "asm-keccak", "otlp", "js-tracer", "keccak-cache-global"]

otlp = [
    "reth-ethereum-cli/otlp",
    "reth-node-core/otlp",
]

jemalloc = [
    "reth-cli-util/jemalloc",
    "reth-node-core/jemalloc",
    "reth-ethereum-cli/jemalloc",
]

asm-keccak = [
    "reth-node-core/asm-keccak",
    "reth-ethereum-cli/asm-keccak",
    "reth-node-ethereum/asm-keccak",
]

js-tracer = [
    "reth-node-ethereum/js-tracer",
]

keccak-cache-global = [
    "reth-node-ethereum/keccak-cache-global",
]

dev = ["reth-ethereum-cli/dev"]

[[bin]]
name = "reth-qmdb"
path = "src/main.rs"
