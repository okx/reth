[package]
name = "reth-qmdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Reth node with QMDB state backend for benchmarking"

[lints]
workspace = true

[dependencies]
# reth
reth-chainspec.workspace = true
reth-ethereum-cli.workspace = true
reth-node-builder.workspace = true
reth-node-ethereum.workspace = true
reth-node-core.workspace = true
reth-provider.workspace = true
reth-cli-util.workspace = true
reth-engine-primitives.workspace = true

# xlayer
xlayer-qmdb-provider.workspace = true

# alloy
alloy-consensus.workspace = true
alloy-primitives.workspace = true

# revm
revm-database.workspace = true
revm-state.workspace = true

# async
tokio = { workspace = true, features = ["sync", "macros", "time", "rt-multi-thread"] }

# misc
clap = { workspace = true, features = ["derive", "env"] }
eyre.workspace = true
tracing.workspace = true

[features]
default = ["jemalloc", "asm-keccak", "otlp", "otlp-logs"]

otlp = [
    "reth-ethereum-cli/otlp",
    "reth-node-core/otlp",
]
otlp-logs = [
    "reth-ethereum-cli/otlp-logs",
    "reth-node-core/otlp-logs",
]

jemalloc = [
    "reth-cli-util/jemalloc",
    "reth-node-core/jemalloc",
    "reth-ethereum-cli/jemalloc",
]

asm-keccak = [
    "reth-node-core/asm-keccak",
    "reth-node-ethereum/asm-keccak",
    "reth-ethereum-cli/asm-keccak",
]

dev = ["reth-ethereum-cli/dev"]

[[bin]]
name = "reth-qmdb"
path = "src/main.rs"
